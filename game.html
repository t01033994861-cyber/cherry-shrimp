<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KOREAN MOVIE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    background:#050505;
    color:white;
    font-family:Arial,sans-serif;

}


/* 메인 히어로 */

.hero{

    height:100vh;

    background:
    linear-gradient(
    rgba(0,0,0,.45),
    rgba(0,0,0,.9)
    ),
    url("movie.jpg");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

}



.hero h1{

    font-size:90px;

    color:#ffd700;

    letter-spacing:5px;

    animation:title 2s;

    text-shadow:
    0 0 20px gold,
    0 0 40px black;

}



.hero p{

    margin-top:25px;

    font-size:28px;

    color:#ddd;

    animation:fade 2s;

}



@keyframes title{

from{

opacity:0;
transform:translateY(-50px);

}

to{

opacity:1;
transform:translateY(0);

}

}



@keyframes fade{

from{

opacity:0;

}

to{

opacity:1;

}

}



/* 버튼 */

.btn{

display:inline-block;

margin-top:40px;

padding:18px 45px;

border-radius:50px;

background:#ffd700;

color:#000;

font-size:22px;

font-weight:bold;

text-decoration:none;

transition:.4s;

}



.btn:hover{

background:white;

transform:scale(1.1);

box-shadow:
0 0 20px gold,
0 0 40px gold;

}



/* 메뉴 */

nav{

position:absolute;

top:0;

width:100%;

padding:30px;

background:rgba(0,0,0,.5);

text-align:center;

}



nav a{

color:white;

text-decoration:none;

font-size:20px;

margin:25px;

transition:.3s;

}



nav a:hover{

color:#ffd700;

}



</style>


</head>



<body>


<nav>

<a href="movie.html">대표 영화</a>

<a href="actor.html">배우</a>

<a href="director.html">감독</a>

<a href="history.html">역사</a>

<a href="game.html">게임</a>

</nav>



<section class="hero">


<div>

<h1>
🎬 KOREAN MOVIE
</h1>


<p>
대한민국 영화의 모든 이야기
</p>


<a class="btn" href="game.html">
🎮 영화 게임 시작
</a>


</div>


</section>



</body>

</html>
