<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KOREAN MOVIE QUIZ</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    background:
    linear-gradient(
    rgba(0,0,0,.8),
    rgba(0,0,0,.95)
    ),
    url("movie.jpg");

    background-size:cover;
    background-position:center;

    color:white;
    font-family:Arial,sans-serif;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

}


/* 게임 박스 */

.game-box{

    width:90%;
    max-width:750px;

    background:rgba(20,20,20,.95);

    padding:40px;

    border-radius:25px;

    text-align:center;

    box-shadow:
    0 0 30px black,
    0 0 40px rgba(255,215,0,.3);

    animation:show .8s;

}



@keyframes show{

from{

opacity:0;

transform:translateY(50px);

}

to{

opacity:1;

transform:translateY(0);

}

}



h1{

    color:#ffd700;

    font-size:45px;

    text-shadow:0 0 20px gold;

}


.subtitle{

    margin:15px;

    color:#ddd;

}



/* 진행 */

.progress{

    margin:20px 0;

    height:15px;

    background:#333;

    border-radius:20px;

    overflow:hidden;

}



.progress-bar{

    height:100%;

    width:0%;

    background:#ffd700;

    transition:.5s;

}



.info{

    display:flex;

    justify-content:space-between;

    margin:20px;

    color:#ffd700;

}



/* 문제 */

.question{

    font-size:28px;

    margin:30px 0;

}



/* 버튼 */

.answer-btn{

    width:80%;

    padding:15px;

    margin:10px;

    border:none;

    border-radius:30px;

    font-size:20px;

    cursor:pointer;

    transition:.3s;

}



.answer-btn:hover{

    background:#ffd700;

    transform:scale(1.05);

}



.correct{

    background:#00a651 !important;

    color:white;

}



.wrong{

    background:#c40000 !important;

    color:white;

}



/* 결과 */

.result{

    display:none;

}



.result h2{

    color:#ffd700;

    font-size:35px;

    margin:20px;

}



.restart{

    background:#ffd700;

    padding:15px 40px;

    border-radius:30px;

    border:none;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

}



.restart:hover{

    background:white;

}



</style>

</head>


<body>



<div class="game-box">


<h1>🎬 KOREAN MOVIE QUIZ</h1>


<p class="subtitle">
한국 영화 마스터에 도전하세요!
</p>


<div id="quiz">


<div class="info">

<span id="number">
문제 1 / 10
</span>


<span>
⭐ 점수 : <span id="score">0</span>
</span>

</div>



<div class="progress">

<div class="progress-bar" id="bar"></div>

</div>



<h2 class="question" id="question">

</h2>



<div id="answers">

</div>


</div>




<div class="result" id="result">


<h2>🏆 결과 발표</h2>


<p id="final"></p>


<br>


<button class="restart" onclick="restart()">

🔄 다시 하기

</button>


</div>



</div>




<script>


const quiz=[

{
q:"영화 '기생충'의 감독은?",
a:["봉준호","박찬욱","나홍진"],
c:"봉준호"
},

{
q:"영화 '부산행'의 주제는?",
a:["좀비","우주","전쟁"],
c:"좀비"
},

{
q:"영화 '올드보이'의 감독은?",
a:["박찬욱","봉준호","류승완"],
c:"박찬욱"
},

{
q:"'범죄도시'의 대표 배우는?",
a:["마동석","송강호","이병헌"],
c:"마동석"
},

{
q:"영화 '신세계'의 장르는?",
a:["범죄","공포","애니메이션"],
c:"범죄"
},

{
q:"영화 '극한직업'의 장르는?",
a:["코미디","SF","역사"],
c:"코미디"
},

{
q:"영화 '아가씨'의 감독은?",
a:["박찬욱","김지운","나홍진"],
c:"박찬욱"
},

{
q:"영화 '베테랑'의 주연 배우는?",
a:["황정민","하정우","공유"],
c:"황정민"
},

{
q:"영화 '괴물'의 감독은?",
a:["봉준호","박찬욱","류승완"],
c:"봉준호"
},

{
q:"아카데미 작품상을 받은 한국 영화는?",
a:["기생충","밀양","설국열차"],
c:"기생충"
}

];


let index=0;

let score=0;



const question=document.getElementById("question");

const answers=document.getElementById("answers");

const number=document.getElementById("number");

const scoreText=document.getElementById("score");

const bar=document.getElementById("bar");



function load(){


number.innerHTML=
"문제 "+(index+1)+" / 10";


question.innerHTML=
quiz[index].q;


answers.innerHTML="";


bar.style.width=
(index/10*100)+"%";



quiz[index].a.forEach(function(item){


let btn=document.createElement("button");


btn.innerHTML=item;

btn.className="answer-btn";


btn.onclick=function(){

check(btn,item);

};


answers.appendChild(btn);



});


}



function check(btn,answer){


let buttons=document.querySelectorAll(".answer-btn");


buttons.forEach(b=>b.disabled=true);



if(answer==quiz[index].c){


btn.classList.add("correct");

score++;

scoreText.innerHTML=score;


}

else{


btn.classList.add("wrong");


buttons.forEach(function(b){

if(b.innerHTML==quiz[index].c){

b.classList.add("correct");

}

});


}



setTimeout(function(){


index++;


if(index<quiz.length){

load();

}

else{

finish();

}


},1000);



}



function finish(){


document.getElementById("quiz").style.display="none";


let grade;


if(score==10){

grade="🏆 한국 영화 마스터";

}

else if(score>=7){

grade="⭐ 영화 전문가";

}

else if(score>=4){

grade="🎬 영화 팬";

}

else{

grade="🎞 초보 관객";

}



document.getElementById("result").style.display="block";


document.getElementById("final").innerHTML=

"점수 : "+score+" / 10<br><br>"+grade;


}



function restart(){


index=0;

score=0;

scoreText.innerHTML=0;


document.getElementById("quiz").style.display="block";

document.getElementById("result").style.display="none";


load();


}



load();


</script>


</body>

</html>
