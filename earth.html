<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USGS Magnitude 2.5+ Earthquakes, Past Day</title>
  
  <!-- Leaflet CSS & JS (cdnjs 고속 CDN 사용) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
    }

    /* 사이드바 */
    #sidebar {
      width: 320px;
      min-width: 320px;
      height: 100%;
      background-color: #f7f7f7;
      border-right: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      z-index: 1000;
    }

    .header-container {
      padding: 16px;
      background-color: #f7f7f7;
      border-bottom: 1px solid #e0e0e0;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .count-text {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 12px;
    }

    .filter-options {
      font-size: 0.85rem;
      color: #444;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-bar {
      display: flex;
      justify-content: space-between;
      padding: 8px 16px;
      background: #eee;
      border-bottom: 1px solid #ddd;
      font-size: 0.75rem;
      color: #666;
    }

    #eq-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .eq-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #e8e8e8;
      cursor: pointer;
    }

    .eq-item:hover {
      background-color: #eaeaea;
    }

    .eq-mag {
      font-size: 1.1rem;
      font-weight: bold;
      width: 45px;
      color: #222;
    }

    .eq-details {
      flex: 1;
    }

    .eq-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #222;
      margin-bottom: 2px;
    }

    .eq-meta {
      font-size: 0.75rem;
      color: #777;
      display: flex;
      justify-content: space-between;
    }

    /* 지도 영역 */
    #map {
      flex: 1;
      height: 100vh;
      width: 100%;
      background-color: #e5e3df;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="header-container">
      <h1>USGS Magnitude 2.5+ Earthquakes, Past Day</h1>
      <div class="count-text" id="eq-count">로딩 중...</div>
      <div class="filter-options">
        <input type="checkbox" id="map-bounds-only">
        <label for="map-bounds-only">Only List Earthquakes Shown on Map</label>
      </div>
    </div>
    
    <div class="sort-bar">
      <span>Format: Magnitude</span>
      <span>Sort: Newest First</span>
    </div>

    <ul id="eq-list"></ul>
  </div>

  <div id="map"></div>

  <script>
    window.addEventListener('load', () => {
      // 1. 지도 생성 (초기 위치 설정)
      const map = L.map('map', {
        center: [20, 0],
        zoom: 2,
        worldCopyJump: true // 지구 동서 무한 스크롤 처리
      });

      // 2. 신뢰성 높은 ESRI Gray 베이스맵 타일 (원본 이미지 스타일과 가장 일치)
      const basemap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
        maxZoom: 16
      }).addTo(map);

      // 지도 사이즈 리셋 (렌더링 깨짐 방지)
      setTimeout(() => { map.invalidateSize(); }, 300);

      // 3. 판 경계선 로드 (백업 CDN 연결)
      const plateUrl = 'https://cdn.jsdelivr.net/gh/fraixedes/tectonicplates@master/GeoJSON/PB2002_boundaries.json';
      
      fetch(plateUrl)
        .then(res => res.json())
        .then(data => {
          L.geoJSON(data, {
            style: {
              color: '#d32f2f', // 원본 이미지의 붉은선
              weight: 1.8,
              opacity: 0.8
            }
          }).addTo(map);
        })
        .catch(err => console.error("판 경계선 로딩 실패:", err));

      // 4. USGS 지진 데이터 API
      const usgsUrl = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson';

      fetch(usgsUrl)
        .then(res => res.json())
        .then(data => {
          const features = data.features;
          document.getElementById('eq-count').textContent = `${features.length} earthquakes.`;

          const listContainer = document.getElementById('eq-list');

          features.forEach(eq => {
            const mag = eq.properties.mag.toFixed(1);
            const place = eq.properties.place;
            const time = new Date(eq.properties.time).toISOString().replace('T', ' ').substring(0, 19) + ' (UTC)';
            const depth = eq.geometry.coordinates[2].toFixed(1) + ' km';
            const [lon, lat] = eq.geometry.coordinates;

            // 지도 위 주황색 지진 마커 생성
            const marker = L.circleMarker([lat, lon], {
              radius: Math.max(mag * 2, 4.5),
              fillColor: '#ff9800',
              color: '#e65100',
              weight: 1,
              opacity: 1,
              fillOpacity: 0.85
            }).addTo(map);

            marker.bindPopup(`
              <div style="font-size:0.85rem; line-height:1.4;">
                <b style="font-size:0.95rem;">${place}</b><br>
                규모: <b>M ${mag}</b><br>
                시간: ${time}<br>
                깊이: ${depth}
              </div>
            `);

            // 사이드바 엘리먼트 추가
            const li = document.createElement('li');
            li.className = 'eq-item';
            li.innerHTML = `
              <div class="eq-mag">${mag}</div>
              <div class="eq-details">
                <div class="eq-title">${place}</div>
                <div class="eq-meta">
                  <span>${time}</span>
                  <span>${depth}</span>
                </div>
              </div>
            `;

            li.addEventListener('click', () => {
              map.setView([lat, lon], 6, { animate: true });
              marker.openPopup();
            });

            listContainer.appendChild(li);
          });
        })
        .catch(err => {
          document.getElementById('eq-count').textContent = '데이터를 불러올 수 없습니다.';
          console.error("지진 데이터 로딩 실패:", err);
        });
    });
  </script>
</body>
</html>
