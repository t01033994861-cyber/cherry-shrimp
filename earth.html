<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<title>EARTHQUAKE MODEL</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

background:#111;

color:white;

font-family:Arial;

text-align:center;

}



h1{

margin:30px;

color:#ffd700;

font-size:50px;

text-shadow:0 0 20px gold;

}



/* 지도 */

#map{

position:relative;

margin:auto;

width:90%;

max-width:1200px;

height:650px;


background:

linear-gradient(
rgba(220,225,230,.8),
rgba(180,190,200,.8)
),

url("earth.jpg");


background-size:cover;

background-position:center;


border:5px solid #555;

overflow:hidden;

box-shadow:0 0 40px black;

}



/* 지진 표시 */

.earthquake{

position:absolute;

width:20px;

height:20px;

background:#ff6600;

border-radius:50%;

box-shadow:

0 0 10px red;


animation:pulse 1.5s infinite;

}



@keyframes pulse{


0%{

transform:scale(1);

opacity:1;

}


100%{

transform:scale(3);

opacity:0;

}


}




.info{

margin:20px;

font-size:25px;

color:#ffd700;

}



button{


padding:15px 40px;

border:none;

border-radius:30px;

background:#ffd700;

font-size:20px;

font-weight:bold;

cursor:pointer;

}


button:hover{

background:white;

transform:scale(1.1);

}



</style>


</head>



<body>


<h1>
🌍 EARTHQUAKE MODEL
</h1>



<div class="info">

현재 발생한 지진 : <span id="count">0</span>

</div>



<div id="map">


</div>


<br>


<button onclick="startEarthquake()">

🌋 지진 발생 시뮬레이션

</button>



<script>



let map=document.getElementById("map");

let count=0;



function startEarthquake(){


let quake=document.createElement("div");


quake.className="earthquake";



let x=Math.random()*90;

let y=Math.random()*85;



quake.style.left=x+"%";

quake.style.top=y+"%";



let size=Math.random()*30+15;


quake.style.width=size+"px";

quake.style.height=size+"px";



map.appendChild(quake);



count++;


document.getElementById("count").innerHTML=count;



setTimeout(()=>{


quake.remove();


},3000);



}




</script>



</body>

</html>
